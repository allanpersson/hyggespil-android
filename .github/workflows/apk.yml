name: Android APK

# Versionering:
#   0.2.43      = første Android-byg af spillets version 0.2.43
#   0.2.43.1    = appen er ændret/rettet, men spillet er stadig 0.2.43
#   0.2.44      = nyt spil
#
# Der oprettes KUN en udgivelse, når indholdet faktisk er ændret. Hver udgivelse
# gemmer et fingeraftryk (app-hash) i noterne, så efterfølgende kørsler kan se,
# at der ikke er noget nyt at bygge – og så springes hele byggeriet over.

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      tving:
        description: Byg alligevel (giver x.y.z.N, selv om intet er ændret)
        type: boolean
        default: false
  repository_dispatch:
    types: [nyt-spil]

permissions:
  contents: write

jobs:
  apk:
    name: Byg, lint og udgiv APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Hent Android-projektet
        uses: actions/checkout@v4

      - name: Hent spillets filer
        uses: actions/checkout@v4
        with:
          repository: allanpersson/hyggespil
          ref: main
          path: game

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Kopiér spillet ind i appen
        run: python tools/synk_spil.py game

      - name: Tjek at spillets filer er komplette
        run: |
          test -f app/src/main/assets/www/hs.html
          test -f app/src/main/assets/www/index.html
          test -f app/src/main/assets/www/hs-cfg.js
          test -f app/src/main/assets/www/extra.json
          n=$(find app/src/main/assets/www -name '*.js' | wc -l)
          echo "js-filer i assets: $n"
          test "$n" -ge 50

      - name: Afgør version og om der skal bygges
        id: plan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TVING: ${{ inputs.tving }}
        run: |
          # Spillets nyeste udgivelse er sandheden – manifestet i main kan være
          # et skridt bagud, fordi CI først skriver versionen i udgivelsen.
          spil=$(gh api repos/allanpersson/hyggespil/releases/latest -q .tag_name 2>/dev/null || true)
          spil=${spil#v}
          if [ -z "$spil" ]; then spil=$(cat version.txt); fi
          sha=$(git rev-parse HEAD)
          base3() { echo "$1" | cut -d. -f1-3; }
          echo "spil=$spil android-sha=$sha"

          latest_tag=$(gh release view --json tagName -q .tagName 2>/dev/null || true)
          latest_body=$(gh release view --json body -q .body 2>/dev/null || true)
          latest_spil=$(printf '%s' "$latest_body" | grep -o 'spil: [0-9.]*' | cut -d' ' -f2 || true)
          latest_sha=$(printf '%s' "$latest_body" | grep -o 'android-sha: [0-9a-f]*' | cut -d' ' -f2 || true)
          echo "seneste=$latest_tag spil=$latest_spil sha=$latest_sha"

          if [ "$TVING" != "true" ] && [ "$latest_spil" = "$spil" ] && [ "$latest_sha" = "$sha" ]; then
            echo "byg=nej" >> "$GITHUB_OUTPUT"
            echo "Ingen ændringer siden $latest_tag – springer over"
            exit 0
          fi

          if [ -n "$latest_tag" ] && [ "$(base3 "$latest_tag")" = "$spil" ]; then
            n=0
            for t in $(gh release list --limit 300 --json tagName -q '.[].tagName'); do
              case "$t" in
                "$spil".*)
                  x=${t#"$spil".}
                  case "$x" in ''|*[!0-9]*) ;; *) [ "$x" -gt "$n" ] && n=$x ;; esac
                  ;;
              esac
            done
            tag="$spil.$((n + 1))"
          else
            tag="$spil"
          fi

          echo "byg=ja" >> "$GITHUB_OUTPUT"
          echo "version=$tag" >> "$GITHUB_OUTPUT"
          echo "spil=$spil" >> "$GITHUB_OUTPUT"
          echo "Spil: $spil · Android-udgivelse: $tag"

      - name: Signeringsnøgle (hvis den findes som secret)
        if: steps.plan.outputs.byg == 'ja'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PW: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/hyggespil.jks"
            echo "ANDROID_KEYSTORE=$RUNNER_TEMP/hyggespil.jks" >> "$GITHUB_ENV"
            echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PW" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_PASSWORD=$KEY_PW" >> "$GITHUB_ENV"
            echo "signerer med udgivelsesnøgle"
          else
            echo "ingen signeringsnøgle – bruger debug-nøgle til selvinstallation"
          fi

      - name: Lint-projektet
        if: steps.plan.outputs.byg == 'ja'
        run: gradle --no-daemon lintDebug -PversionName=${{ steps.plan.outputs.version }}

      - name: Byg APK til selvinstallation
        if: steps.plan.outputs.byg == 'ja'
        run: gradle --no-daemon assembleRelease -PversionName=${{ steps.plan.outputs.version }}

      - name: Byg AAB til Google Play
        if: steps.plan.outputs.byg == 'ja'
        run: gradle --no-daemon bundleRelease -PversionName=${{ steps.plan.outputs.version }}

      - name: Tjek APK'ens indhold og version
        if: steps.plan.outputs.byg == 'ja'
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          unzip -l "$apk" | grep -q 'assets/www/hs.html' || { echo "hs.html mangler i APK"; exit 1; }
          unzip -l "$apk" | grep -q 'assets/www/index.html' || { echo "index.html mangler i APK"; exit 1; }
          echo "APK: $(du -h "$apk" | cut -f1) – version ${{ steps.plan.outputs.version }}"

      - name: Omdøb filerne
        if: steps.plan.outputs.byg == 'ja'
        run: |
          mkdir -p ud
          cp app/build/outputs/apk/release/app-release.apk "ud/hyggespil-${{ steps.plan.outputs.version }}.apk"
          cp app/build/outputs/bundle/release/app-release.aab "ud/hyggespil-${{ steps.plan.outputs.version }}.aab"
          ls -l ud

      - name: Gem som artifact
        if: steps.plan.outputs.byg == 'ja'
        uses: actions/upload-artifact@v4
        with:
          name: hyggespil-apk-${{ steps.plan.outputs.version }}
          path: ud/*
          retention-days: 30

      - name: Opret udgivelse med APK
        if: steps.plan.outputs.byg == 'ja'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v="${{ steps.plan.outputs.version }}"
          spil="${{ steps.plan.outputs.spil }}"
          sha=$(git rev-parse HEAD)

          # Tag spillets changelog-afsnit med, så Android-udgivelsen viser de samme
          # nyheder. Udgivelsens egen tekst bruges først, fordi main kan være et
          # skridt bagud; derefter prøves CHANGELOG i den hentede kopi.
          gh api "repos/allanpersson/hyggespil/releases/tags/$spil" -q .body > /tmp/spil_noter.md 2>/dev/null || true
          if [ ! -s /tmp/spil_noter.md ]; then
            python - "$spil" > /tmp/spil_noter.md <<'PY'
            import re, sys
            version = sys.argv[1]
            tekst = open("game/CHANGELOG.md", encoding="utf-8").read()
            m = re.search(r"^## " + re.escape(version) + r"\b[^\n]*\n(.*?)(?=^## |\Z)", tekst, re.M | re.S)
            print(m.group(1).strip() if m else "Se spillets CHANGELOG for nyheder.")
            PY
          fi

          {
            cat /tmp/spil_noter.md
            echo ""
            echo "---"
            if [ "$v" != "$spil" ]; then
              echo "Ny bygning af Android-appen på samme spilversion ($spil)."
              echo ""
            fi
            echo "Android-app til Hyggespil $v. De tre første led følger spillet; et fjerde led betyder en ny bygning på samme spilversion."
            echo ""
            echo "Hent APK’en, åbn den på telefonen og tillad installation fra denne kilde."
            echo ""
            echo "spil: $spil"
            echo "android-sha: $sha"
          } > /tmp/noter.md

          gh release create "$v" ud/* --title "Hyggespil Android $v" --notes-file /tmp/noter.md --latest

name: Android APK

# Android-versionen følger spillets version. Er der brug for at bygge igen på
# samme spilversion (fx en rettelse i appen), får udgivelsen et fjerde led:
# 0.2.43 → 0.2.43.1 → 0.2.43.2.
#
# Kører ved push, hver time og manuelt. Springer over, når spillets version
# allerede har en Android-udgivelse – med mindre man tvinger en ny.

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      tving:
        description: Byg også selv om spillets version findes (giver x.y.z.N)
        type: boolean
        default: true
  repository_dispatch:
    types: [nyt-spil]

permissions:
  contents: write

jobs:
  apk:
    name: Byg, lint og udgiv APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Hent Android-projektet
        uses: actions/checkout@v4

      - name: Hent spillets filer
        uses: actions/checkout@v4
        with:
          repository: allanpersson/hyggespil
          ref: main
          path: game

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Kopiér spillet ind i appen
        run: python tools/synk_spil.py game

      - name: Tjek at spillets filer er komplette
        run: |
          test -f app/src/main/assets/www/hs.html
          test -f app/src/main/assets/www/index.html
          test -f app/src/main/assets/www/hs-cfg.js
          test -f app/src/main/assets/www/extra.json
          n=$(find app/src/main/assets/www -name '*.js' | wc -l)
          echo "js-filer i assets: $n"
          test "$n" -ge 50

      - name: Afgør version og om der skal bygges
        id: plan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          base=$(cat version.txt)
          findes=nej
          gh release view "$base" --repo allanpersson/hyggespil-android >/dev/null 2>&1 && findes=ja

          byg=ja
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event_name }}" = "push" ]; then
            [ "$findes" = "ja" ] && byg=nej
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.tving }}" != "true" ]; then
            byg=nej
          fi

          tag="$base"
          if [ "$findes" = "ja" ]; then
            max=0
            for t in $(gh release list --repo allanpersson/hyggespil-android --limit 300 --json tagName -q '.[].tagName'); do
              case "$t" in
                "$base".*)
                  n=${t#"$base".}
                  case "$n" in ''|*[!0-9]*) ;; *) [ "$n" -gt "$max" ] && max=$n ;; esac
                  ;;
              esac
            done
            tag="$base.$((max + 1))"
          fi

          echo "spilversion: $base"
          echo "findes: $findes"
          echo "byg: $byg"
          echo "version: $tag" >> "$GITHUB_OUTPUT"
          echo "byg=$byg" >> "$GITHUB_OUTPUT"
          echo "udgivelse: $tag"

      - name: Signeringsnøgle (hvis den findes som secret)
        if: steps.plan.outputs.byg == 'ja'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PW: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/hyggespil.jks"
            echo "ANDROID_KEYSTORE=$RUNNER_TEMP/hyggespil.jks" >> "$GITHUB_ENV"
            echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PW" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_PASSWORD=$KEY_PW" >> "$GITHUB_ENV"
            echo "signerer med udgivelsesnøgle"
          else
            echo "ingen signeringsnøgle – bruger debug-nøgle til selvinstallation"
          fi

      - name: Lint-projektet
        if: steps.plan.outputs.byg == 'ja'
        run: gradle --no-daemon lintDebug -PversionName=${{ steps.plan.outputs.version }}

      - name: Byg APK til selvinstallation
        if: steps.plan.outputs.byg == 'ja'
        run: gradle --no-daemon assembleRelease -PversionName=${{ steps.plan.outputs.version }}

      - name: Byg AAB til Google Play
        if: steps.plan.outputs.byg == 'ja'
        run: gradle --no-daemon bundleRelease -PversionName=${{ steps.plan.outputs.version }}

      - name: Tjek APK'ens indhold og version
        if: steps.plan.outputs.byg == 'ja'
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          unzip -l "$apk" | grep -q 'assets/www/hs.html' || { echo "hs.html mangler i APK"; exit 1; }
          unzip -l "$apk" | grep -q 'assets/www/index.html' || { echo "index.html mangler i APK"; exit 1; }
          echo "APK: $(du -h "$apk" | cut -f1) – version ${{ steps.plan.outputs.version }}"

      - name: Omdøb filerne
        if: steps.plan.outputs.byg == 'ja'
        run: |
          mkdir -p ud
          cp app/build/outputs/apk/release/app-release.apk "ud/hyggespil-${{ steps.plan.outputs.version }}.apk"
          cp app/build/outputs/bundle/release/app-release.aab "ud/hyggespil-${{ steps.plan.outputs.version }}.aab"
          ls -l ud

      - name: Gem som artifact
        if: steps.plan.outputs.byg == 'ja'
        uses: actions/upload-artifact@v4
        with:
          name: hyggespil-apk-${{ steps.plan.outputs.version }}
          path: ud/*
          retention-days: 30

      - name: Opret udgivelse med APK
        if: steps.plan.outputs.byg == 'ja'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v="${{ steps.plan.outputs.version }}"
          gh release create "$v" ud/* \
            --title "Hyggespil Android $v" \
            --notes "Android-app til Hyggespil $v. Første led følger spillet; et fjerde led betyder en ny bygning på samme spilversion. Hent APK'en, åbn den på telefonen og tillad installation fra denne kilde." \
            --latest

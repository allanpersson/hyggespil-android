name: Android APK

# Bygger APK og AAB ved hvert push, dagligt og ved manuel kørsel.
# Linter projektet, tjekker at spillets filer faktisk ligger i APK'en, og lægger
# begge filer på en udgivelse, så de kan hentes direkte.

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [nyt-spil]

permissions:
  contents: write

jobs:
  apk:
    name: Byg, lint og udgiv APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Hent Android-projektet
        uses: actions/checkout@v4

      - name: Hent spillets filer
        uses: actions/checkout@v4
        with:
          repository: allanpersson/hyggespil
          ref: main
          path: game

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Kopiér spillet ind i appen
        run: python tools/synk_spil.py game

      - name: Tjek at spillets filer er komplette
        run: |
          test -f app/src/main/assets/www/hs.html
          test -f app/src/main/assets/www/index.html
          test -f app/src/main/assets/www/hs-cfg.js
          test -f app/src/main/assets/www/extra.json
          n=$(find app/src/main/assets/www -name '*.js' | wc -l)
          echo "js-filer i assets: $n"
          test "$n" -ge 50

      - name: Læs spilversion
        id: version
        run: |
          v=$(cat version.txt)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "spilversion: $v"

      - name: Signeringsnøgle (hvis den findes som secret)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PW: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/hyggespil.jks"
            echo "ANDROID_KEYSTORE=$RUNNER_TEMP/hyggespil.jks" >> "$GITHUB_ENV"
            echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PW" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_PASSWORD=$KEY_PW" >> "$GITHUB_ENV"
            echo "signerer med udgivelsesnøgle"
          else
            echo "ingen signeringsnøgle – bruger debug-nøgle til selvinstallation"
          fi

      - name: Lint-projektet
        run: gradle --no-daemon lintDebug -PversionName=${{ steps.version.outputs.version }}

      - name: Byg APK til selvinstallation
        run: gradle --no-daemon assembleRelease -PversionName=${{ steps.version.outputs.version }}

      - name: Byg AAB til Google Play
        run: gradle --no-daemon bundleRelease -PversionName=${{ steps.version.outputs.version }}

      - name: Tjek APK'ens indhold og version
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          unzip -l "$apk" | grep -q 'assets/www/hs.html' || { echo "hs.html mangler i APK"; exit 1; }
          unzip -l "$apk" | grep -q 'assets/www/index.html' || { echo "index.html mangler i APK"; exit 1; }
          if unzip -l "$apk" | grep -qE 'assets/www/(extra|ledger)\.json' && unzip -p "$apk" assets/www/extra.json | grep -q '"'; then
            echo "ADVARSEL: extra.json indeholder data"
          fi
          echo "APK: $(du -h "$apk" | cut -f1) – version ${{ steps.version.outputs.version }}"
          ls -l app/build/outputs/apk/release/

      - name: Omdøb filerne
        run: |
          mkdir -p ud
          cp app/build/outputs/apk/release/app-release.apk "ud/hyggespil-${{ steps.version.outputs.version }}.apk"
          cp app/build/outputs/bundle/release/app-release.aab "ud/hyggespil-${{ steps.version.outputs.version }}.aab"
          ls -l ud

      - name: Gem som artifact
        uses: actions/upload-artifact@v4
        with:
          name: hyggespil-apk-${{ steps.version.outputs.version }}
          path: ud/*
          retention-days: 30

      - name: Opret udgivelse med APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v${{ steps.version.outputs.version }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" ud/* --clobber
          else
            gh release create "$tag" ud/* \
              --title "Hyggespil Android ${{ steps.version.outputs.version }}" \
              --notes "Android-app til Hyggespil ${{ steps.version.outputs.version }}. Hent APK'en, åbn den på telefonen og tillad installation fra denne kilde." \
              --latest
          fi
